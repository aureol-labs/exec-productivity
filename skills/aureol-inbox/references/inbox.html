<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Priority inbox</title>
<!--
  THE PRIORITY INBOX. Template, built by tools/build-templates.py from design/. Do
  not edit the built file: edit design/pages/inbox.html, design/partial.css,
  design/partial.js or design/dictionary.json and rebuild.

  WHAT THIS IS
  Everything unread, in one queue, categorised and ranked. Two jobs, and they are
  different jobs. Categorising keeps the mailbox clean. Ranking decides what you
  touch. The page never lets the first pretend to be the second: the lead is a
  count, not a claim, and the bulk is called "labelled, still unread", which says
  exactly what happened and exactly what did not. Mail, Slack and Teams on one page,
  ranked as one queue, with a filter to see one channel at a time. The channel is a
  monochrome mark in the left column.

  THE WRITES
  Labels only. Never a delete, never a send, never a mark as read, never a move.
  The routine does not archive: it labels To archive under rules the exec wrote,
  and the exec clears the label in their own mailbox. Every label opens on the rule
  that filed it and on what is inside. Where the mail role cannot write labels, the
  page shows "The rest, grouped" instead, without rules, and the footer says
  nothing was written.

  PRIORITY (0.13.0)
  The inbox has no Drop: a line leaves when it is read. The exec's one judgement is its
  priority: Lower priority on a queue line sends it to the rest, Prioritise on a
  line of the rest or of a label brings it into the queue at Today. The live layer writes
  priority/<slug of ref> {page: "inbox", ref, level: up|down, at} to this artifact's store;
  the inbox run reads that collection before it ranks. What follows describes Drop as the
  other pages still have it, and dismissals an older inbox wrote, which still hold.

  DROP
  Every queue row carries one gesture of the exec's own, Drop, at the end of its
  sources row after Ask Claude. It asks why, inline (Done, Not important), and
  writes dismissals/<slug of ref> {page: "inbox", kind: "queue", ref, say, reason:
  done|not_important, date} to this artifact's store; the row greys where it stands
  and says "remembered". The inbox routine reads that collection before it ranks
  and never brings a dropped thread back (a done thread also keeps its follow-ups
  out for 7 days). Nothing is written to the mailbox. Published with the db
  capability (capabilities: {db: {}}) so Drop is remembered; without it Drop copies
  a line for Claude and the row says "waiting for Claude".
  At load the page reads its store and applies what the exec did since publish, so
  a drop or a save survives a reload; the next routine run publishes a page without
  those rows. Once the store resolves, every dismissals document whose page is
  "inbox" and whose ref is a queue row's ref leaves that row as a fresh drop does:
  closed, greyed, "remembered", no Drop word. Recounted from the rows still
  standing: the title's "N need you, K now" and the filter's counts. The unread counts
  are the connectors' and stay: a drop marks nothing read. A read that fails, or a
  store that is null, changes nothing and shows nothing.

  HOW IT RENDERS
  The routine never hand-writes rows. It builds one JSON document and puts it in the
  <script id="data" type="application/json"> element in place of the DATA_JSON placeholder, with
  every "<" in the serialised JSON escaped as \u003c. render() builds the whole DOM
  from that JSON. When the placeholder is left unreplaced, the page renders the example
  embedded in <script id="example">. Every UI string comes from the dictionary,
  English or French from data.lang. Data is never translated by the page.
  tools/check-page.py refuses a document that breaks a rule below.

  THE JSON, IN SHORT (the full fixture is skills/aureol-inbox/references/example.json)
    lang, date_label, time_label, today, sub, gesture, links   as on every page
    counts        { mail: 61, chat: 41 }      unread, read off the connectors on every
                  run: 0 when a channel was read and is empty, null when it could not
                  be read (the title then says "chat not read"), never absent
    notices       [ "one line" ]   only when a count is null: what could not be read, in
                  the exec's language, under the title; two at most, twelve words each
    queue         [ row ]   ordered: tier, then oldest first inside a tier; twelve at most
      a row       { id, ref, read, tier: now|today|week, channel: mail|slack|teams, channels,
                    say, meta: { kind: "time" | "date", value }, type, argument: [fact],
                    sources, briefing }
      say         the ask with the name; argument, one entry, the fact it is on the
                  page for, shown when the line opens; no advice
      channels    optional, ["mail","slack"]: one topic on two channels is one line.
                  It lists every channel the line stands for, contains channel, at
                  most one thread per channel; the sentence carries one mark per
                  channel and the title counts the line once per channel
      ref         optional string, the stable key Drop is remembered under: the
                  thread id ("thread:...") or its link; a bounce, its own id
                  ("message:..."); a merged line joins its thread ids with "+",
                  mail first; absent, the page falls back to the first source
                  href, then to the row id
      read        optional, true when the exec already opened what the line stands
                  for: it still needs them (someone visibly waiting, a bounce) and
                  is not counted as unread
      type        precedent | knock_on | pattern | history      never absent
      meta        when the message arrived: a clock for today, a date before that
    filed         [ label ]  only where the mail role could write labels
      a label     { id, label, tint, count, by_channel: { mail, slack, teams },
                    lede, rule, contents: [item], href, briefing }
                  the row is the tally and the label; lede only when something
                  inside deserves the exec's eye; no sources, the contents are the
                  sources;
                  tint is one of sales|product|board|customers|hiring|later|receipts|arch;
                  arch is To archive, drawn as an outline, and carries rules: [{count,
                  rule}] instead of one rule; every other label carries its rule, in
                  the exec's words
      an item     { channel, from, what, href }   3 to 5 of them, every one a link;
                  the count minus the items shown is "and N more in this label"
    grouped       [ group ]  the same shape without rule, when filed is empty
    wrote         true when labels were written, false otherwise
    next_run      "13:00"
    others        { mail: 3, chat: 2, items: [ { channel, from, what, href, when } ] }  every
                  unread that is neither waiting on the exec nor filed, the full list, newest
                  first, so the title's counts reconcile: counts.mail = unread queue lines
                  carrying mail + filed mail + others.mail, same for chat. The page shows 3 lines and
                  "show all N" opens the rest. Absent or zero: nothing rendered.
    generated     the run's time, ISO with the hour: the live page sorts only what is newer
    seen          { ref: newest message time } for every thread the run read
    live          { mail: {server, api: aureol|gmail, label} | null, chat: {server, api:
                  slack} | null, rules: [{label, rule}], lens }   what the live page needs;
                  absent, the page is what the run published and nothing more
    a row, live   kind (decision|info|action|fyi|unclear, shown before the time) and live:
                  { at, from, thread, account } for mail, { at, from, channel_id, ts } for
                  Slack, so the page finds the thread again
      ref         { id } same page (opens the target) or { page, id } another page
      src         { kind: mail|chat|calendar|doc|meeting|file|you, via, label, href }

  LIVE
  Opened in Claude with its capabilities (db, sample, mcp on the servers in live),
  the page reads mail and chat itself: it folds a line answered, read, archived or
  dropped since the run under the queue, sorts with Claude only what arrived after it (the whole inbox on
  a day no run has published yet), files new mail under live.rules, and adds to
  every line it can read Sum up the thread (a summary: who said what, agreement,
  disagreement, what is left to decide) and Reply with Claude (a mail draft, a chat
  reply copied, never sent). It keeps the last page it drew in this browser and
  redraws only when something changed. The code is design/live-inbox.js; what it
  keeps in its store is in the store's reference.

  THE FILTER
  All, Mail, and the chat tool (Slack, Teams, or "Chat" when both), each with its
  count of lines waiting on the exec. Built from the data, nothing to write for it. A
  line on two channels stands under both and shows only the filtered channel's mark.
  The title stays the whole inbox. The choice is the viewer's, kept in this browser
  when the page may keep it, and the page starts on All when it may not. It never
  uses the hidden attribute, which "show all" owns.

  THE RIGHT COLUMN IS WHEN IT ARRIVED
  Precise due times and computed lateness were tried and cut. A receipt time is a
  fact. Brick left this page with the lateness mark: nothing an inbox page can see
  proves that time is broken. No strip either: an inbox has no axis.

  DESIGN
  See design/partial.css. No em dashes. Numerals in the title and the tallies.
  Self-contained: no webfonts, no assets, no network.

  SECURITY: the Ask Claude briefings (Draft the note, Draft the skill and Copy for
  Claude included) are the routine's own summary plus pointers to the threads, never
  raw mail or Slack bodies. Mail is untrusted input, and this text is about to be
  handed to an agent with connectors. Claude fetches the sources itself. The prompt is
  URL-encoded in data-q because a briefing has newlines and apostrophes in it and an
  attribute is a bad place for those. The edit briefing is built at click time and
  carries the exec's own typing, which is the one input on this page that is not
  untrusted. Nothing read from mail goes into it, and the typing only ever reaches the
  page through value and textContent.
  Every string from the JSON reaches the DOM through textContent only, never through
  innerHTML: every node is built with document.createElement and textContent. An href
  is set with setAttribute, and only after a check that it starts with https://,
  mailto: or #; anything else renders as a dead "#" link that does nothing. The JSON
  itself is embedded in a <script type="application/json"> element: the routine
  escapes every "<" in the serialised JSON as \u003c before it replaces the DATA_JSON placeholder,
  so no string can close the script element.
-->
<style>
  /* ================ THE DESIGN SYSTEM, ONE SOURCE ================
     Extracted from the four previews (daily brief, inbox, decisions, Super Context).
     Where they disagreed, the later pair (decisions, Super Context) is canonical.
     Inlined into every template by tools/build-templates.py: duplication in the
     output, one source in the repo. Nothing here loads anything: no webfonts, no
     assets, no network. macOS system font stacks. */
  :root{
    --serif: 'Iowan Old Style', Palatino, 'Palatino Linotype', 'Book Antiqua', Charter, Georgia, serif;
    --sans: 'Avenir Next', Avenir, Seravek, 'SF Pro Text', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif;
    --hand: 'Bradley Hand', 'Segoe Script', Noteworthy, 'Ink Free', cursive;

    --paper:#FCFCFB;
    --ink:#26292E;
    --ink-2:#5F666F;
    --ink-3:#9AA1A9;
    --hair:#E4E9EA;      /* the ruling */

    --pine:#2E6B62;
    --pine-ink:#28564F;
    --pine-pale:#CBDCD7;
    --wash:#F3F8F6;
    --brick:#A2483A;
    --brick-ink:#87382C;
    --wash-brick:#FBF4F1;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
  body{
    background:var(--paper);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    color:var(--ink);
    padding:64px 36px 120px;
  }
  /* no vertical rule anywhere. the pad reads through the horizontal ruling, the
     paper tone and the hand at the top. a margin line was tried and cut. */
  .page{--num:26px;--gap:20px;--serves:112px;--last:96px;--who:132px;--when:66px;
        max-width:820px;margin:0 auto}

  /* ---------- head ---------- */
  /* one line naming which page of the notebook this is */
  .book{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;font-weight:600;
        color:var(--pine);margin-bottom:18px}
  .top{display:flex;justify-content:space-between;align-items:baseline;gap:20px}
  /* the one line in a hand, the way you write the date at the top of a pad */
  .eyebrow{font-family:var(--hand);font-size:18px;font-weight:400;
           letter-spacing:.2px;color:var(--ink-2)}
  h1{font-family:var(--serif);font-size:34px;line-height:1.22;font-weight:400;margin:16px 0 0}
  .sub{font-size:15px;line-height:1.55;color:var(--ink-2);margin-top:13px;max-width:72ch}

  /* ---------- section head: label, rule, count ---------- */
  h2{display:flex;align-items:center;gap:14px;margin:52px 0 6px;
     font-size:11px;letter-spacing:1.5px;text-transform:uppercase;font-weight:600;color:var(--pine)}
  h2 i{flex:1;height:1px;background:var(--hair);display:block}
  h2 b{font-weight:400;color:var(--ink-3);letter-spacing:.3px;white-space:nowrap;
       text-transform:none;font-size:12px}
  h2 em{font-style:normal;font-weight:600;color:var(--brick)}
  /* Edit is a gesture, so it is set the way every gesture in the notebook is: pine,
     semibold, and never in capitals. It hides while the editor is open, because the
     editor carries its own way out. */
  h2 .edit{all:unset;cursor:pointer;font-size:12.5px;font-weight:600;letter-spacing:.2px;
     text-transform:none;color:var(--pine);border-bottom:1px solid transparent}
  h2 .edit:hover{border-bottom-color:var(--pine)}
  h2 .edit:focus-visible{outline:2px solid var(--pine);outline-offset:3px;border-radius:2px}
  .editing h2 .edit{visibility:hidden}

  /* ================ METRICS ================
     Above the day strip, so the number is read before the meetings. A short row of
     numeral tiles and one line saying where they came from. Rendered only when the
     routine has a source; nothing otherwise. */
  .metrics{display:flex;flex-wrap:wrap;gap:16px 40px;align-items:baseline;margin-top:44px}
  .metrics .tile b{display:block;font-family:var(--serif);font-size:30px;line-height:1.1;
     font-weight:400;color:var(--ink);font-variant-numeric:tabular-nums}
  .metrics .tile span{display:block;margin-top:5px;font-size:11px;letter-spacing:.4px;
     color:var(--ink-3)}
  .metrics .from{flex-basis:100%;font-size:11px;color:var(--ink-3)}

  /* ================ THE DAY STRIP ================ */
  .ends{display:flex;justify-content:space-between;margin-top:18px;
        font-size:10.5px;letter-spacing:.4px;color:var(--ink-3)}
  .strip{position:relative;height:84px;margin-top:5px}
  .track{position:absolute;top:0;left:0;right:0;height:40px;
         background:#F2F4F4;border-radius:4px}

  /* a free block wide enough to name. sits in the track, not interactive. */
  .free{position:absolute;top:0;height:40px;display:flex;align-items:center;
        justify-content:center;left:var(--l);width:var(--w);
        font-size:11px;color:var(--ink-3);white-space:nowrap;overflow:hidden}

  /* one button per meeting. its box is the block; the label hangs below it and is
     still part of the button, so either half is a hit target. */
  .mt{all:unset;box-sizing:border-box;position:absolute;top:0;height:100%;
      left:var(--l);width:var(--w);cursor:pointer;overflow:visible}
  .mt .blk{position:absolute;top:0;left:0;right:0;height:40px;border-radius:3px;
     background:var(--pine-pale);transition:background .14s,box-shadow .14s}
  .mt.key .blk{background:var(--pine)}
  .mt:hover .blk{background:var(--pine-ink)}
  .mt.on .blk{background:var(--pine-ink);box-shadow:0 0 0 2px #fff, 0 0 0 3.5px var(--pine)}
  .mt:focus-visible .blk{box-shadow:0 0 0 2px #fff, 0 0 0 3.5px var(--pine)}

  .mt .lbl{position:absolute;top:50px;left:50%;transform:translateX(-50%);
     white-space:nowrap;text-align:center;font-size:11.5px;line-height:1.35;color:var(--ink-3)}
  .mt .lbl b{display:block;font-weight:600;color:var(--ink-2);letter-spacing:.2px}
  .mt:hover .lbl,.mt.on .lbl,.mt:hover .lbl b,.mt.on .lbl b{color:var(--pine)}

  /* ---- double booking ----
     Two meetings at once is not a drawing problem, it is a decision. So the pair is
     ONE block spanning both, ONE label, ONE brief. Inside the block the two meetings
     are stacked lanes at their true offsets. Lanes split the track: 2 at 18px, 3 at
     11px. Four or more still draws 3 lanes and the label carries the real count. */
  .mt.clash{--lh:18px;--ls:22px}
  .mt.clash.three{--lh:11px;--ls:14.5px}
  .mt.clash .blk{left:var(--l);right:auto;width:var(--w);height:var(--lh);
     top:calc(var(--lane) * var(--ls));background:var(--brick)}
  .mt.clash:hover .blk{background:var(--brick-ink)}
  .mt.clash.on .blk{background:var(--brick-ink);
     box-shadow:0 0 0 2px #fff, 0 0 0 3px var(--brick)}
  .mt.clash:focus-visible .blk{box-shadow:0 0 0 2px #fff, 0 0 0 3px var(--brick)}
  .mt.clash .lbl,.mt.clash .lbl b{color:var(--brick)}
  .mt.clash:hover .lbl,.mt.clash.on .lbl,
  .mt.clash:hover .lbl b,.mt.clash.on .lbl b{color:var(--brick-ink)}

  /* ================ THE LISTS ================
     The notepad part. The ruling is generated by the rows rather than painted
     behind them, so a line can never fall out of register with the type. Closed
     top and bottom like a pad. Horizontal only. */
  .list{border-top:1px solid var(--hair);border-bottom:1px solid var(--hair)}
  /* the queue's left column holds the channel marks, so the eye can run down it and
     see mail from chat without reading. The tier is said once, over its lines.
     the filed list's left column holds a tally, so it is narrow and set in the
     serif like every other quantity in the notebook. */
  .queue{--num:40px}
  .filed{--num:38px;--chip:84px}
  .queue .chs{display:flex;align-items:baseline;gap:5px}
  .queue .chs .ch{margin-right:0;vertical-align:0;position:relative;top:2px}
  .tierh{font-size:9.5px;letter-spacing:1.3px;text-transform:uppercase;font-weight:600;
     color:var(--ink-3);padding:20px 0 6px;border-top:1px solid var(--hair)}
  .tierh:first-child,.tierh.first{border-top:none;padding-top:14px}
  .tierh.now{color:var(--pine)}
  .tierh.off,.rest.off,.mini.off,.fsec.off{display:none}
  .list.queue{margin-top:30px}
  .row>button:hover .chs .ch,.row.open .chs .ch{color:var(--pine)}

  /* ================ THE FILTER ================
     All, Mail, Slack: one queue, seen whole or one channel at a time. The choice is
     the viewer's and stays on this device. It never uses the hidden attribute, which
     "show all" owns: the page's data-f is matched against each line's data-ch. */
  .seg{display:inline-flex;gap:2px;margin-top:24px;padding:3px;border-radius:999px;
     background:#F0F3F3}
  .seg button{all:unset;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--ink-2);
     padding:5px 14px 5px;border-radius:999px;line-height:1.4;white-space:nowrap}
  .seg button b{font-weight:400;color:var(--ink-3);margin-left:7px;font-variant-numeric:tabular-nums}
  .seg button:hover{color:var(--pine)}
  .seg button.on{background:#fff;color:var(--pine);box-shadow:0 1px 2px rgba(38,41,46,.14)}
  .seg button.on b{color:var(--pine)}
  .seg button:focus-visible{outline:2px solid var(--pine);outline-offset:2px}
  @media screen{
    .page[data-f="mail"] [data-ch]:not([data-ch~="mail"]),
    .page[data-f="chat"] [data-ch]:not([data-ch~="chat"]){display:none}
  }

  /* a label row with nothing under the filter goes, and the first one standing
     carries no rule above it, since the list has its own */
  .filed .row.off{display:none}
  .filed .row.first>button{border-top:none}
  /* a label row is a tally and a name, so it sits lower than a queue line */
  .filed .row>button{padding:12px 6px 12px 0}
  .filed .row.open>button{padding-bottom:10px}
  .filed .n{font-size:18px;line-height:1.45}
  .filed .why{padding-top:4px}

  .row+.row>button{border-top:1px solid var(--hair)}
  .row>button{all:unset;box-sizing:border-box;width:100%;cursor:pointer;display:grid;
     grid-template-columns:var(--num) 1fr auto;column-gap:var(--gap);align-items:baseline;
     padding:16px 6px 16px 0;transition:background .14s}
  .row>button:hover{background:#F5F8F8}
  .row>button:focus-visible{outline:2px solid var(--pine);outline-offset:-2px}
  .row.flat>button{cursor:default}
  .row.flat>button:hover{background:none}
  /* the button carries the same tint as the reveal, so an open row is one block */
  .row.open>button,.row.open>button:hover{background:var(--wash);padding-bottom:12px}

  .n{font-family:var(--serif);font-size:20px;line-height:1.4;color:var(--ink-3);
     text-align:right;transition:color .14s}
  .row>button:hover .n,.row.open .n{color:var(--pine)}
  .say{display:block;font-size:16px;line-height:1.5;font-weight:500}
  .filed .say{font-size:15.5px;font-weight:400;color:var(--ink-2)}
  /* the second line. On a priority it is what it comes before, which is the entry
     test, so it is on the face and not in the reveal. On a topic it is where the
     thread stands this morning. Same register for both. */
  .ahead,.state{display:block;margin-top:3px;font-size:13.5px;line-height:1.45;
     color:var(--ink-2)}
  /* a reveal that holds only its sources: no rule above them */
  .why>.src:first-child{margin-top:2px;padding-top:0;border-top:none}
  /* ---- the marker ----
     The second line of the first column, on the rows that have a relationship. Grey
     for a fact, brick for a conflict, pine for the routine's own hand, and it says
     which in words either way. */
  .rel{display:block;margin-top:5px;font-size:11.5px;line-height:1.4;
       letter-spacing:.2px;color:var(--ink-3)}
  .rel.cf{color:var(--brick);font-weight:600}
  .rel.nw{color:var(--pine);font-weight:600}

  /* the right column. Every mark in it is a time or a date the routine read off a
     calendar, a message or the file, never a number it worked out. */
  .meta{font-size:12.5px;line-height:1.7;color:var(--ink-3);
     white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
  .row>button:hover .meta,.row.open .meta{color:var(--pine)}
  .meta .cat{margin:0 10px 0 0;vertical-align:0}
  /* brick, and only once the time has gone by: "Was due 10:00". It carries a word. */
  .meta.late,.row>button:hover .meta.late,.row.open .meta.late{color:var(--brick);font-weight:600}
  .meta.late:before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;
     background:var(--brick);margin-right:7px;vertical-align:1px}

  /* the rank, as a word. NOW is the only one drawn as an object rather than set as
     type, and Today and This week stay quiet because they are not the point. */
  .tier{font-size:9.5px;letter-spacing:1.1px;text-transform:uppercase;font-weight:600;
     white-space:nowrap;color:var(--ink-3)}
  .tier.today{color:var(--ink-2)}
  .tier.now{color:#fff;background:var(--pine);border-radius:3px;
     padding:4px 8px 3px;margin-left:-1px;display:inline-block;letter-spacing:1.2px}

  /* ---- the label palette ----
     The label the routine wrote, drawn as the tinted chip a mail label actually is.
     Label tints are BACKGROUNDS, and pine and brick are only ever TYPE. To archive is
     the exception, drawn as an outline rather than a fill, because nothing has
     happened to it yet. On a filed line the chip runs ahead of the sentence, so it
     is given a fixed width. */
  .cat{font-size:9.5px;letter-spacing:1.1px;text-transform:uppercase;font-weight:600;
     display:inline-block;padding:3px 7px 2px;border-radius:3px;margin-right:11px;
     vertical-align:1.5px;background:#EDEEEC;color:var(--ink-2)}
  .filed .say .cat{min-width:var(--chip)}
  .cat.sales    {background:#E3EDF7;color:#33587A}
  .cat.product  {background:#ECE7F6;color:#54467C}
  .cat.board    {background:#EFE9DF;color:#6A5941}
  .cat.customers{background:#E0EFED;color:#2C5F5B}
  .cat.hiring   {background:#F6E7EB;color:#7B4557}
  .cat.later    {background:#EAEBE7;color:#6A6A61}
  .cat.receipts {background:#F4EEDB;color:#6E5E2C}
  .cat.arch     {background:none;box-shadow:inset 0 0 0 1px #D8DAD5;color:#6A6A61}

  /* ---- the channel mark ----
     Monochrome, inline, in ink, from <symbol> defs at the top of the body. Every
     glyph is the same box, so the sentences after them stay aligned. */
  .ch{width:15px;height:15px;flex:none;vertical-align:-2px;margin-right:9px;
      color:var(--ink-2)}
  /* the same marks at tally size, counting a category across channels */
  .ch.sm{width:12.5px;height:12.5px;margin:0 5px 0 14px;vertical-align:-1.5px;
      color:var(--ink-3)}
  .meta .ch.sm:first-child{margin-left:0}

  /* ---- the tables ----
     Live topics, people and organisations, decisions: a grid rather than a <table>
     because every row opens. Aligned columns, a header row, one rule per line. */
  .cols{display:grid;grid-template-columns:1fr var(--serves) var(--last);
        column-gap:var(--gap);padding:14px 6px 9px 0;
        font-size:9.5px;letter-spacing:1.3px;text-transform:uppercase;font-weight:600;
        color:var(--ink-3)}
  .cols span+span{text-align:right}
  .tt .row>button{grid-template-columns:1fr var(--serves) var(--last)}
  .dl .cols,.dl .row>button{grid-template-columns:1fr var(--who) var(--when)}
  .serves,.role,.last,.who,.when{font-size:12.5px;line-height:1.7;color:var(--ink-3);
     text-align:right;white-space:nowrap}
  .last,.when{font-variant-numeric:tabular-nums}
  .row>button:hover .last,.row.open .last,
  .row>button:hover .when,.row.open .when{color:var(--pine)}
  /* None is ink and semibold, never brick. It is a question the reveal answers, not
     a time that broke. The word carries it, so it would survive a laser printer. */
  .serves.none{color:var(--ink);font-weight:600}
  /* a decision that no longer holds, or a priority dropped on the page: greyed, and
     left exactly where it happened. Never moved into an archive section. */
  .row.gone .say{color:var(--ink-3);font-weight:400}
  .row.gone .ahead,.row.gone .state{color:var(--ink-3)}
  /* ---- the closed list ----
     What left the page, greyed, after the decisions. No reveal and no button: a flat
     face in the table grid, the reason as the marker under the name, the date at
     the right. Three rows show; "and N more" is a quiet link for the rest. */
  .cl .row>.face{display:grid;grid-template-columns:1fr var(--last);column-gap:var(--gap);
     align-items:baseline;padding:16px 6px 16px 0}
  .cl .row+.row>.face{border-top:1px solid var(--hair)}
  .cl .more{border-top:1px solid var(--hair);padding:12px 6px 12px 0;font-size:12.5px}
  .cl .more a{color:var(--ink-3);text-decoration:none;border-bottom:1px solid transparent}
  .cl .more a:hover{color:var(--pine);border-bottom-color:var(--pine)}
  .cl .more a:focus-visible{outline:2px solid var(--pine);outline-offset:3px;border-radius:2px}

  /* ================ THE REVEAL ================
     Two kinds. A brief hangs off the strip and stays a card. A row reveal hangs off
     its line, so an open row is ONE block: no radius, no inset, and the measure sits
     on the content, which is the only reason max-width is on the children and not on
     the box. A numbered list's reveal starts in the sentence column, past the number.
     A table's starts flush, because there is no number to indent past. */
  .why{display:none;background:var(--wash);
       padding:1px 6px 24px calc(var(--num) + var(--gap))}
  .tt .why,.dl .why{padding-left:0}
  .row.open>.why{display:block}
  .why>*{max-width:620px}
  .why.mbrief{border-radius:5px;padding:24px 34px 26px;margin-top:16px;max-width:none}
  /* .brief must not set `display` outside a guard, or it beats .why{display:none} */
  .why.brief{grid-template-columns:1fr 1fr;gap:16px 28px}
  .mbrief.on{display:grid}
  .why.brief>*{max-width:none}
  .brief .wide{grid-column:1/-1}
  .brief p{font-size:14px}
  .bhead{grid-column:1/-1;font-size:14.5px;font-weight:600;color:var(--pine-ink);padding-bottom:2px}
  /* the ask. first line of every reveal, so the decision is legible before the
     reason is read. */
  .lede{font-size:16px;line-height:1.4;font-weight:600;color:var(--pine-ink);
     margin-bottom:13px}
  .tag{font-size:9.5px;letter-spacing:1.3px;text-transform:uppercase;font-weight:600;
       color:var(--pine);display:block;margin:15px 0 6px}
  .lede+.tag,.why>.tag:first-child{margin-top:0}
  .brief .tag{margin:0 0 6px}
  .why p{font-size:14.5px;line-height:1.6;color:var(--pine-ink)}
  .why p+p{margin-top:9px}
  .why .plain{color:var(--ink-2)}
  /* a counted stack: the rules, one line each. the paragraph gap is a reading gap,
     and these are a tally rather than prose. */
  .why .tight p+p{margin-top:5px}
  .why .tight+.plain{margin-top:12px}
  .why .tight b{font-weight:600;font-variant-numeric:tabular-nums;
     display:inline-block;min-width:26px}
  /* the question a conflict leaves open. It is a question and not an answer,
     because the routine noticing is not the routine ruling. */
  .why .land{margin-top:12px;color:var(--brick);font-weight:600}

  /* a clash reveal is the same component in brick, so you know before you read it
     that this one is about time being broken rather than about a decision */
  .why.clash{background:var(--wash-brick)}
  .why.clash .tag{color:var(--brick)}
  .why.clash .bhead{color:var(--brick-ink)}
  .why.clash p:not(.plain){color:var(--brick-ink)}

  /* ---- what the routine knows about it ----
     Typed rows under the argument, built the way a meeting brief is: a small pine tag,
     then the substance. On a topic, Who, So far and Next. On a priority, the exec's
     own reason and the line's history. Every date is read off a thread, an invite or
     the file, never worked out. */
  .ctx{display:grid;grid-template-columns:88px 1fr;column-gap:16px;row-gap:13px;
     margin-top:17px}
  .ctx .tag{margin:3px 0 0}
  .why .ctx p,.ctx li{font-size:13.5px;line-height:1.55;color:var(--ink-2)}
  .ctx ol{list-style:none;display:grid;grid-template-columns:max-content 1fr;
     column-gap:14px;row-gap:3px}
  .ctx li{display:contents}
  .ctx li b{font-weight:500;color:var(--pine-ink);font-variant-numeric:tabular-nums;
     white-space:nowrap}
  /* a relation or a person named inside a reveal jumps to its row, already open */
  .ctx a{color:var(--pine-ink);text-decoration:none;border-bottom:1px solid rgba(46,107,98,.30)}
  .ctx a:hover{color:var(--pine);border-bottom-color:var(--pine)}
  .ctx a:focus-visible{outline:2px solid var(--pine);outline-offset:2px;border-radius:2px}
  .ctx ol.with .wn{font-weight:500;white-space:nowrap;justify-self:start}
  .ctx ol.with .wn i{font-style:normal;font-weight:400;font-size:11px;letter-spacing:.3px;
     color:var(--ink-3)}
  /* the exec's own words about a person. Ink, and it says so in words as well. */
  .ctx .said{font-size:12px;color:var(--ink-3);white-space:nowrap;margin-left:3px}
  /* the one brick mark on the page: a promise the routine can see */
  .ctx li.late b{color:var(--brick);font-weight:600}
  /* the exec's own reason, recorded when they wrote the line. Ink, because it is
     their world and not the routine's argument. */
  .why .ctx .yours{color:var(--ink);font-size:14.5px;line-height:1.6}

  /* ---- what is actually in the label ----
     Shorter rows than the queue, quieter type, no reveal of their own. Five lines
     and a count, never the whole label. Every line is a link to its own thread, and
     the count is a link to the label. */
  .mini{margin-top:15px}
  .mini>a{display:flex;align-items:baseline;padding:7px 0;font-size:13.5px;
     line-height:1.45;color:var(--ink-2);text-decoration:none;
     border-bottom:1px solid rgba(46,107,98,.11);transition:color .12s}
  .mini>a:first-child{border-top:1px solid rgba(46,107,98,.11)}
  .mini>a[hidden],.mini>a.tk{display:none}
  .mini .when{margin-left:auto;padding-left:12px;white-space:nowrap;color:var(--ink-3);
     font-size:12.5px}
  .mini>a:hover{color:var(--ink)}
  .mini>a:focus-visible{outline:2px solid var(--pine);outline-offset:2px;
     border-radius:2px}
  .mini b{font-weight:600;color:var(--ink);margin-right:9px;white-space:nowrap;
     transition:color .12s}
  .mini>a:hover b{color:var(--pine)}
  .mini .ch{width:13px;height:13px;margin-right:10px;color:var(--ink-3);
     vertical-align:-1.5px}
  .mini .more{border-bottom:none;color:var(--ink-3);font-size:12.5px;padding-top:9px}
  .mini .more:hover{color:var(--pine)}

  /* ---- where it came from ----
     Every reveal ends with its sources, so a claim can be checked and the thing it
     is about can be opened. Provenance first, convenience second. Cap of three. If
     a fourth source would help, the reveal itself is too long. */
  .src{display:flex;flex-wrap:wrap;gap:7px 20px;margin-top:15px;padding-top:12px;
       border-top:1px solid rgba(46,107,98,.16)}
  .brief .src{grid-column:1/-1}
  .src a{font-size:12.5px;color:var(--pine);text-decoration:none;
         border-bottom:1px solid rgba(46,107,98,.22);padding-bottom:1px}
  .src a i{font-style:normal;font-weight:600;font-size:9.5px;letter-spacing:1px;
           text-transform:uppercase;color:var(--ink-3);margin-right:8px}
  .src a:hover{color:var(--pine-ink);border-bottom-color:var(--pine)}
  .src a:hover i{color:var(--pine)}
  .src a:focus-visible{outline:2px solid var(--pine);outline-offset:3px;border-radius:2px}
  .why.clash .src{border-top-color:rgba(162,72,58,.16)}
  .why.clash .src a{color:var(--brick);border-bottom-color:rgba(162,72,58,.22)}
  .why.clash .src a:hover{color:var(--brick-ink);border-bottom-color:var(--brick)}
  .why.clash .src a:hover i{color:var(--brick)}

  /* ---- ask claude ----
     One gesture, the same two words on every reveal. It COPIES the briefing (or, when
     the exec chose the link gesture at install, opens claude.ai with it). It lives at
     the right end of the sources row, so it adds no height, and it is the only
     semibold thing in that row, which is how you tell go from look. */
  .src .ask{margin-left:auto;font-weight:600;white-space:nowrap;
     border-bottom-color:transparent}
  .src .ask:hover{border-bottom-color:var(--pine)}
  .why.clash .src .ask:hover{border-bottom-color:var(--brick)}
  /* a.ask.ok, not .ask.ok: `.why.clash .src a` carries an element selector and would
     otherwise repaint the spent state brick. Spent is grey in both variants. */
  .src a.ask.ok{font-weight:400;color:var(--ink-3);cursor:default;
     border-bottom-color:transparent}

  /* a cross-reference always carries the thing itself, and jumps to it */
  .go{margin-top:11px}
  .go a{display:inline-block;font-size:14.5px;line-height:1.5;color:var(--pine);
        text-decoration:none;border-bottom:1px solid rgba(46,107,98,.30);padding-bottom:1px}
  .go a:before{content:"\2192";margin-right:9px;opacity:.6}
  .go a:hover{color:var(--pine-ink);border-bottom-color:var(--pine)}
  .go a:focus-visible{outline:2px solid var(--pine);outline-offset:3px;border-radius:2px}

  /* ---- keep, drop, decline ----
     The page's own writes, on a proposed decision and on a suggestion. Set like every
     gesture: pine, semibold, never capitals. Drop and Decline stay quiet. The note
     beside them says what happened, and only what happened. */
  .act{display:flex;align-items:baseline;gap:18px;margin-top:16px}
  .act button{all:unset;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--pine);
     border-bottom:1px solid transparent}
  .act button:hover{border-bottom-color:var(--pine)}
  .act button.quiet{font-weight:400;color:var(--ink-3)}
  .act button.quiet:hover{color:var(--ink);border-bottom-color:var(--ink-3)}
  .act button:focus-visible{outline:2px solid var(--pine);outline-offset:3px;border-radius:2px}
  .act .note{font-size:12px;font-weight:600;color:var(--pine)}
  .act .note.bad{color:var(--brick)}

  /* ---------- foot ---------- */
  footer{margin-top:48px;padding-top:16px;border-top:1px solid var(--hair);
     font-size:12px;color:var(--ink-3);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}

  /* the credit line. Small, last, and outside the footer rule so it reads as a
     signature rather than as another row of the page. */
  .by{margin-top:20px;display:flex;align-items:center;gap:9px;
      font-size:11px;letter-spacing:.3px;color:var(--ink-3)}
  .by .mark{width:26px;height:auto;color:var(--pine);flex:none;
      position:relative;top:-1px}
  .by a{color:var(--ink-3);text-decoration:none;border-bottom:1px solid var(--hair)}
  .by a:hover{color:var(--pine);border-bottom-color:var(--pine-pale)}
  .by a:focus-visible{outline:2px solid var(--pine);outline-offset:2px;border-radius:2px}

  /* ================ THE EDITOR ================
     The priority lines become fields in place, in the exec's ink rather than the
     routine's pine, because this is the one place on the page they write. */
  .pending{display:none;margin-top:11px;font-size:12px;color:var(--ink-3)}
  .pending.on{display:block}
  .editing .pending.on{display:none}
  .edbox{display:none}
  .editing .edbox{display:block}
  .editing #pri{display:none}
  .elist{border-top:1px solid var(--hair);border-bottom:1px solid var(--hair)}
  .erow{display:grid;grid-template-columns:var(--num) 1fr auto;column-gap:var(--gap);
     align-items:baseline;padding:15px 6px 15px 0}
  .erow+.erow{border-top:1px solid var(--hair)}
  .erow .n{color:var(--pine)}
  .erow textarea{all:unset;display:block;box-sizing:border-box;width:100%;min-width:0;
     resize:none;overflow:hidden;white-space:pre-wrap;overflow-wrap:break-word;
     font-family:var(--sans);color:var(--ink);padding:1px 0 3px;
     border-bottom:1px solid var(--hair);transition:border-color .14s}
  .erow textarea:focus{border-bottom-color:var(--pine)}
  .erow textarea::placeholder{color:var(--ink-3);opacity:1}
  .e-say{font-size:16px;line-height:1.5;font-weight:500}
  .e-ahead{display:flex;align-items:baseline;gap:8px;margin-top:7px;
     font-size:13.5px;line-height:1.45;color:var(--ink-2)}
  .e-ahead span{white-space:nowrap}
  .erow .e-ahead textarea{flex:1;font-size:13.5px;line-height:1.45;color:var(--ink-2)}
  .e-note{display:block;margin-top:8px;font-size:11.5px;line-height:1.4;
     font-weight:600;color:var(--pine)}
  .ectl{display:flex;gap:2px;align-self:center}
  .ectl button,.eadd button,.ebar button{all:unset;cursor:pointer;font-size:12.5px;
     border-radius:3px}
  .ectl button{color:var(--ink-3);padding:4px 8px;min-width:12px;text-align:center}
  .ectl button:hover{color:var(--pine);background:var(--wash)}
  .ectl button:disabled{opacity:.3;cursor:default;background:none;color:var(--ink-3)}
  .eadd{padding:12px 0 0 calc(var(--num) + var(--gap));font-size:12px;color:var(--ink-3)}
  .eadd button{font-weight:600;color:var(--pine)}
  .ebar{display:flex;align-items:baseline;gap:20px;margin-top:14px;padding-top:12px;
     border-top:1px solid var(--hair)}
  .rest{margin:14px 0 0;font-size:12.5px;line-height:1.7;color:var(--ink-3);max-width:620px}
  .rest a{color:var(--ink-3);text-decoration:none;border-bottom:1px solid var(--hair)}
  .rest a:hover{color:var(--pine);border-bottom-color:var(--pine-pale)}
  .emsg{flex:1;font-size:12px;color:var(--ink-3)}
  .emsg.bad{color:var(--brick)}
  .ebar .e-x{color:var(--ink-3)}
  .ebar .e-x:hover{color:var(--ink)}
  .ebar .e-go{font-weight:600;color:#fff;background:var(--pine);border:1px solid var(--pine);
     border-radius:999px;padding:5px 14px;line-height:1.4}
  .ebar .e-go:hover{background:var(--pine-ink);border-color:var(--pine-ink)}
  .ebar .e-go:disabled{font-weight:500;color:var(--ink-3);background:none;border-color:var(--hair);cursor:default}
  .ebar .e-x{padding:5px 0}
  .ectl button:focus-visible,.eadd button:focus-visible,.ebar button:focus-visible{
     outline:2px solid var(--pine);outline-offset:2px}

  /* ================ DROP, WITH A REASON ================
     The one word at the end of the sources row, after Ask Claude, in the quiet type
     of a source and never semibold: look, not go. One click and the word becomes the
     reasons, inline, in the same quiet type with the pine hover every gesture on the
     page has. The same question stands in for Drop on a decision and in the
     priorities editor, so it is set after them and wins the type. The note beside it
     says what happened, and only what happened. The marker on the row is .rel. */
  .src .drop{margin-left:auto}
  .src .ask~.drop{margin-left:0}
  /* the question takes its own line at the right, under Ask Claude, so it lands in
     the same place at every width instead of wherever the sources left room */
  .src .dropq{flex-basis:100%;justify-content:flex-end}
  .src a.drop{font-weight:400;color:var(--ink-3);white-space:nowrap;border-bottom-color:transparent}
  .src a.drop:hover{color:var(--pine);border-bottom-color:var(--pine)}
  .dropq{display:inline-flex;flex-wrap:wrap;align-items:baseline;gap:7px 14px;
     font-size:12.5px;line-height:1.5}
  .dropq button{all:unset;cursor:pointer;color:var(--ink-3);white-space:nowrap;
     border-bottom:1px solid transparent}
  .dropq button:hover{color:var(--pine);border-bottom-color:var(--pine)}
  .dropq button.x{color:var(--ink-3)}
  .dropq button.x:hover{color:var(--ink);border-bottom-color:var(--ink-3)}
  .dropq button:disabled{cursor:default;color:var(--ink-3);border-bottom-color:transparent}
  .dropq button:focus-visible{outline:2px solid var(--pine);outline-offset:3px;border-radius:2px}
  .dropq .note{font-size:12px;font-weight:600;color:var(--pine)}
  .dropq .note:empty{display:none}
  .dropq .note.bad{color:var(--brick)}
  .ectl .dropq{gap:4px 12px;padding:4px 8px}

  @media (max-width:660px){
    body{padding:32px 20px 64px}
    .page{--num:22px;--gap:14px}
    .queue{--num:36px}
    .queue .row>button{grid-template-columns:var(--num) 1fr}
    .filed{--num:30px}
    h1{font-size:27px}
    .eyebrow{font-size:16px}
    .strip{height:78px}
    .mt .lbl{font-size:10.5px;top:47px}
    .free{font-size:9.5px}
    .why.brief{grid-template-columns:1fr}
    /* on a phone the sentence and the reveal are stacked inside one tinted block, so
       they share a right edge. Both get the same inset: right padding stays on the
       button because a line touching the tint edge reads as clipped, and it matches
       on the reveal because 4px of difference between two stacked paragraphs is the
       kind of ragged edge you see without being able to name. */
    .why{padding-right:10px;padding-bottom:22px}
    .row>button{grid-template-columns:var(--num) 1fr;row-gap:3px;padding-right:10px}
    .meta{grid-column:2;text-align:left}
    .meta .ch.sm:first-child{margin-left:0}
    /* on a phone the mini row stops being two columns and becomes one sentence */
    .mini>a{display:block}
    .mini .ch{margin-right:7px}
    /* the tables: the first column takes the full width, and the right columns share
       the line under it. Serves carries its own word there, because on its own under
       a topic it could be read as a second name. */
    .cols{padding-top:10px}
    .cols span:nth-child(2){display:none}
    .cols,.tt .row>button{grid-template-columns:1fr var(--last)}
    .dl .cols,.dl .row>button{grid-template-columns:1fr var(--when)}
    .tt .row>button,.dl .row>button{row-gap:3px;padding-right:0}
    .tt .dec,.dl .dec{grid-column:1 / -1}
    .serves,.role,.who{grid-column:1;text-align:left}
    .serves:before{content:"Serves ";font-weight:400;color:var(--ink-3)}
    html[lang="fr"] .serves:before{content:"Sert ";}
    .tt .why,.dl .why{padding-left:0;padding-right:8px}
    .ctx{grid-template-columns:1fr;row-gap:4px}
    .ctx .tag{margin-top:12px}
    .ctx .tag:first-child{margin-top:0}
    .erow{grid-template-columns:var(--num) 1fr}
    .ectl{grid-column:2;margin:8px 0 0 -8px}
  }
  @media print{
    body{padding:0;background:#fff}
    .why{display:block!important;background:none;padding-top:2px;padding-bottom:16px}
    .why.brief{display:grid!important}
    /* the card's own padding and the clash tint both have to be named again, not just
       overridden by .why above, because .why.mbrief and .why.clash are the more
       specific selectors and would each keep what they set. A tint that is gone does
       not need padding holding it off the type, and a brick wash on a laser is a grey
       box. The clash head still says "2 meetings" in brick type, which is where the
       meaning was anyway. */
    .why.mbrief{padding:6px 0 0}
    .why.clash{background:none}
    .row.open>button{background:none}
    .src .ask,.src .drop,.dropq,h2 .edit,.edbox,.act,.pending{display:none!important}
    /* on paper the closed list is whole: the link goes, the tucked rows show */
    .cl .more{display:none!important}
    .cl .row[hidden]{display:block}
    /* same on the inbox's rest: every line, no link */
    .others .more{display:none!important}
    .others>a[hidden],.others>a.tk{display:flex}
    /* paper shows every channel, whatever the screen was filtered to */
    .seg{display:none!important}
    .editing #pri{display:block}
    .go a,.src a,.by a,.ctx a{border-bottom:none}
    .src{border-top:none;padding-top:2px;margin-top:8px}
    /* a chip printed on a laser is a grey box, so the label goes back to being type */
    .cat{background:none!important;box-shadow:none;padding:0;color:var(--ink)}
    .tier.now{background:none;color:var(--pine);padding:0}
  }
  /* ================ THE LIVE LAYER ================
     What the live page adds: the banner under the title, placeholder lines on an
     empty page while Claude sorts, the struck lines, the two gestures in each
     reveal's sources row and the panels they open, and the lens as a quiet link.
     Built only from the design system's tokens and type sizes. */
  .lxrun{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px;margin-top:16px;
     padding:9px 14px;border-radius:5px;background:var(--wash);font-size:13px;line-height:1.5;
     color:var(--ink-2);max-width:72ch}
  .lxrun .lxbar{flex:1 1 90px;height:2px;align-self:center;background:var(--pine-pale);
     position:relative;overflow:hidden;border-radius:2px}
  .lxrun .lxbar i{position:absolute;top:0;bottom:0;left:-30%;width:30%;background:var(--pine);
     animation:lxbar 1.3s ease-in-out infinite}
  .lxrun .lxsecs{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
  .lxrun.done .lxbar,.lxrun.done .lxsecs{display:none}
  @keyframes lxbar{from{left:-30%}to{left:100%}}
  /* all:unset on a gesture also unsets the hidden attribute's display: restate it */
  .lxq[hidden],.lxgo[hidden],.lxref[hidden]{display:none!important}
  .lxref{all:unset;cursor:pointer;margin-left:auto;align-self:center;display:inline-flex;padding:2px;border-radius:3px;color:var(--ink-3)}
  .lxref svg{width:14px;height:14px;display:block}
  .lxref:hover{color:var(--pine)}
  .lxref:focus-visible{outline:2px solid var(--pine);outline-offset:2px}
  .lxref.busy{color:var(--pine);cursor:default}
  .lxref.busy svg{animation:lxspin 1s linear infinite}
  @keyframes lxspin{to{transform:rotate(360deg)}}

  .lxskel{display:grid;grid-template-columns:var(--num) 1fr auto;column-gap:var(--gap);
     align-items:center;padding:19px 6px 19px 0;border-top:1px solid var(--hair)}
  .lxskel:first-child{border-top:none}
  .lxskel i{display:block;height:10px;border-radius:5px;background:var(--hair);
     animation:lxsk 1.4s ease-in-out infinite}
  .lxskel i:nth-child(1){width:15px}.lxskel i:nth-child(2){width:68%}.lxskel i:nth-child(3){width:40px}
  @keyframes lxsk{0%,100%{opacity:.5}50%{opacity:1}}


  /* ---- handled since the sort: folded under the queue ---- */
  .lxdone{--num:40px;margin-top:12px}
  .lxdone .lxdonet{font-size:12.5px;color:var(--ink-3)}
  .lxdonel{margin-top:8px;border-top:1px solid var(--hair)}
  .lxdr{display:grid;grid-template-columns:var(--num) 1fr auto;column-gap:var(--gap);align-items:baseline;
     padding:10px 6px 10px 0;border-bottom:1px solid var(--hair)}
  .lxdr .ch{color:var(--ink-3)}
  .lxdr .say{display:block;font-size:14.5px;line-height:1.5;color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--ink-3)}
  .lxdr .rel{display:block;margin-top:2px;font-size:11.5px;color:var(--ink-3)}
  .lxdr .meta{font-size:12.5px;color:var(--ink-3);white-space:nowrap}
  @media (max-width:660px){ .lxdr{grid-template-columns:var(--num) 1fr} .lxdr .meta{grid-column:2} }

  /* the two gestures sit in the sources row in the source type: look, not go */

  /* ---- buttons, not links ----
     In the sources row, a link opens a source and a button does something. The actions sit
     on their own line as small outlined pills; an open one is tinted; Drop stays quiet at the
     right. Light on purpose: one filled button at most on the page, in the reply. */
  .src .lxacts{flex-basis:100%;display:flex;flex-wrap:wrap;align-items:center;gap:8px 8px;margin-top:4px}
  .lxacts a.lxa,.lxacts a.ask,.lxp a.lxout.go{font-size:12.5px;line-height:1.3;font-weight:500;color:var(--pine-ink);
     padding:4px 11px;border-radius:999px;border:1px solid rgba(46,107,98,.30);background:rgba(255,255,255,.55);
     text-decoration:none;white-space:nowrap;transition:background .12s,border-color .12s}
  .lxacts a.lxa:hover,.lxacts a.ask:hover,.lxp a.lxout.go:hover{border-color:var(--pine);background:#fff}
  .lxacts a.lxa[aria-expanded="true"]{background:var(--pine-pale);border-color:var(--pine-pale)}
  /* the two that start the work are the strong ones: sum up and reply */
  .src .lxacts a.ask{margin-left:0}
  .lxacts a.lxa.main,.lxp a.lxout.go{font-weight:600}
  .lxacts{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
  .lxacts a.lxout{font-size:12.5px;color:var(--pine);text-decoration:none;border-bottom:1px solid rgba(46,107,98,.22);margin-left:4px}
  .lxacts a.lxout:hover{color:var(--pine-ink);border-bottom-color:var(--pine)}
  .lxacts a.ask.ok{color:var(--ink-3);border-color:var(--hair);font-weight:500}
  .src .lxacts a.drop{margin-left:auto;padding:4px 2px;border:0;background:none}
  /* Lower priority: quiet, at the right, where Drop was */
  .src .lxacts a.lxdown{margin-left:auto;font-size:12.5px;color:var(--ink-3);text-decoration:none;border-bottom:1px solid transparent;padding:4px 2px;white-space:nowrap}
  .src .lxacts a.lxdown:hover{color:var(--pine);border-bottom-color:var(--pine)}
  .src .lxacts .dropq{flex-basis:100%;justify-content:flex-end}

  /* ---- the rest and the labels, worked in place ----
     Each line is a block: the line itself, a check that marks it read on hover, and the
     same actions as a queue line, opened under it. */
  .mini>.lxm{position:relative;border-bottom:1px solid rgba(46,107,98,.11)}
  .mini>.lxm:first-child{border-top:1px solid rgba(46,107,98,.11)}
  .mini>.lxm[hidden],.mini>.lxm.tk{display:none}
  .mini .lxm>a{display:flex;align-items:baseline;padding:7px 0;font-size:13.5px;line-height:1.45;color:var(--ink-2);
     text-decoration:none;transition:color .12s}
  .mini .lxm>a:hover,.mini .lxm.on>a{color:var(--ink)}
  .mini .lxm>a:hover b,.mini .lxm.on>a b{color:var(--pine)}
  .mini .lxm>a:focus-visible{outline:2px solid var(--pine);outline-offset:2px;border-radius:2px}
  .lxmp{padding:2px 0 14px 23px}
  .lxmp>.lxacts{margin-top:2px}
  .lxmh{position:absolute;right:0;top:6px;display:none;gap:6px;padding-left:10px;background:var(--paper)}
  .why .mini .lxmh{background:var(--wash)}
  .lxmr{all:unset;cursor:pointer;position:relative;display:inline-flex;align-items:center;justify-content:center;
     width:22px;height:22px;border-radius:999px;color:var(--pine);border:1px solid rgba(46,107,98,.30);background:var(--paper)}
  .lxmr svg{width:13px;height:13px;display:block}
  .lxmr:hover{background:var(--pine-pale);border-color:var(--pine-pale)}
  .lxmr:focus-visible{outline:2px solid var(--pine);outline-offset:2px}
  .mini>.lxm:focus-within>.lxmh{display:inline-flex}
  /* marked read, for 5 seconds: the line dims where it stands and offers Undo */
  .lxundo{display:inline-flex;align-items:baseline;gap:10px;font-size:12.5px;font-weight:600;color:var(--pine-ink);white-space:nowrap}
  .lxundo .lxq{color:var(--pine);font-weight:500;border-bottom:1px solid rgba(46,107,98,.30);font-variant-numeric:tabular-nums}
  .lxundo .lxq:hover{color:var(--pine-ink);border-bottom-color:var(--pine)}
  .row.lxpend>button .say{opacity:.5}
  .mini>.lxm.pend>a{opacity:.5}
  .mini>.lxm.pend>a .when{visibility:hidden}
  .mini>.lxm>.lxundo{position:absolute;right:0;top:7px;padding-left:12px;background:var(--paper)}
  .why .mini>.lxm>.lxundo{background:var(--wash)}
  /* the check's tooltip: a word, on hover and on focus */
  .lxmr[data-tip]:hover::after,.lxmr[data-tip]:focus-visible::after{content:attr(data-tip);position:absolute;right:0;bottom:calc(100% + 6px);
     white-space:nowrap;font:500 11.5px/1.3 var(--sans);color:#fff;background:var(--ink);padding:4px 8px;border-radius:4px;pointer-events:none}
  @media (hover:hover){
    .mini>.lxm:hover>.lxmh{display:inline-flex}
    .mini>.lxm:hover>a .when{visibility:hidden}
  }

  /* a panel hangs under the sources row, inside the reveal */
  .lxp{margin-top:14px;padding-top:12px;border-top:1px solid rgba(46,107,98,.16)}
  .lxline{display:flex;flex-wrap:wrap;align-items:baseline;gap:7px 16px;font-size:12.5px;
     line-height:1.5;color:var(--ink-3)}
  .lxline+.lxline,.lxta+.lxline{margin-top:10px}
  .lxmeter{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
  .lxline .lxmeter:last-child{margin-left:auto}
  .lxq{all:unset;cursor:pointer;font-size:12.5px;color:var(--ink-3);white-space:nowrap;
     border-bottom:1px solid transparent}
  .lxq:hover{color:var(--pine);border-bottom-color:var(--pine)}
  .lxq:disabled{opacity:.45;cursor:default;border-bottom-color:transparent}
  .lxq:focus-visible,.lxgo:focus-visible,.lxlens:focus-visible{outline:2px solid var(--pine);outline-offset:3px;border-radius:2px}
  .lxgo{all:unset;cursor:pointer;font-size:12.5px;font-weight:600;line-height:1.4;color:#fff;
     background:var(--pine);border:1px solid var(--pine);border-radius:999px;padding:4px 13px;white-space:nowrap}
  .lxgo:hover{background:var(--pine-ink);border-color:var(--pine-ink)}
  .lxgo:disabled{font-weight:500;color:var(--ink-3);background:none;border-color:var(--hair);cursor:default}
  .lxta{display:block;box-sizing:border-box;width:100%;min-height:150px;margin-top:2px;padding:10px 12px;
     font:14.5px/1.6 var(--sans);color:var(--ink);background:var(--paper);border:1px solid var(--hair);
     border-radius:4px;resize:vertical}
  .lxta:focus{outline:none;border-color:var(--pine-pale)}
  .lxin{flex:1 1 180px;min-width:0;font:12.5px var(--sans);padding:2px 0;color:var(--ink);background:transparent;
     border:0;border-bottom:1px solid var(--hair);border-radius:0}
  .lxin:focus{outline:none;border-bottom-color:var(--pine)}
  .lxin::placeholder{color:var(--ink-3);opacity:1}
  .lxskip{font-size:13.5px;color:var(--ink-2)}
  .lxnote{margin-top:8px;font-size:12px;font-weight:600;color:var(--pine)}
  .lxnote:empty{display:none}
  .lxnote.bad{color:var(--brick)}
  .lxp a.lxout{font-size:12.5px;color:var(--pine);text-decoration:none;border-bottom:1px solid rgba(46,107,98,.22)}
  .lxp a.lxout:hover{color:var(--pine-ink);border-bottom-color:var(--pine)}

  /* the thread, summarised: the design system's typed rows */
  .lxsum .ctx{margin-top:2px}
  .lxsum .ctx ol li span{color:var(--ink-2)}
  .lxsum .ctx .land{margin-top:0;color:var(--brick);font-weight:600}
  .lxsum .ctx div p+p{margin-top:4px}
  .lxsum:empty{display:none}

  /* the lens: one quiet line under the footer */
  .lxlens{display:inline-block;margin-top:14px;font-size:12px;color:var(--ink-3);text-decoration:none;
     border-bottom:1px solid var(--hair);cursor:pointer}
  .lxlens:hover{color:var(--pine);border-bottom-color:var(--pine-pale)}
  .lxlensbox{margin-top:10px;max-width:620px}
  /* the demo's switch: as quiet as the lens link, the current choice in ink */
  .lxdemo{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;margin-top:10px;font-size:12px;color:var(--ink-3)}
  .lxdemo .lxq{font-size:12px}
  .lxdemo .lxq.on{color:var(--ink);font-weight:600;cursor:default}
  .lxdemo .lxq.on:hover{border-bottom-color:transparent}
  .lxlensrun{font-size:12.5px;line-height:1.6;color:var(--ink-3);white-space:pre-line;margin-bottom:10px}
  .lxlensbox .lxta{min-height:160px;font-size:13.5px}

  @media (max-width:660px){
    .mini .lxm>a{display:block}
    .lxmp{padding-left:0}

  @media print{ .lxrun,.lxp,.src a.lxa,.lxlens,.lxlensbox{display:none!important} }

    if(isNaN(a)||isNaN(b)) return false;
    var diff=(b-a)/86400000;
    return diff>=0 && diff<days;

  function minutes(hhmm){

  /* ---------- shared pieces ---------- */

  /* a cross-reference carries its whole substance as link text. Same page: opens the

  function goRow(g){

  /* a long list shows its first n lines and one quiet link for the rest; the link

  function tuck(list,n,key){

    if(!rest.length) return;
    rest.forEach(function(r){ r.hidden=true; });

  function credit(){

  /* a quiet mark on a row, in pine, for a moment: "Saved". Or in brick: "Not saved". */

  /* ---------- the database, when this view can run it ----------
     `window.claude` carries `use` and nothing else. The namespace arrives through the
     promise, never at first paint, and `null` means this view cannot run it: a plain
     browser, a saved file, a host that never answers. Every page renders without it
     and lights the writes up when it resolves. */
  var DB=null, DB_KNOWN=false, onDb=function(){};
  function dbInit(cb){
    onDb=cb||function(){};
    try{
      if(window.claude && typeof window.claude.use==='function'){
        window.claude.use('db').then(function(d){ DB=d||null; DB_KNOWN=true; onDb(); },
                                     function(){ DB=null; DB_KNOWN=true; onDb(); });
        return;

  }

  /* ---------- interaction ---------- */
  /* the lists: one row open at a time, so the page never becomes a wall */
  function t(b){
    var r=b.parentNode, was=r.classList.contains('open');
    document.querySelectorAll('.row.open').forEach(function(o){
      o.classList.remove('open');
      var ob=o.querySelector('button'); if(ob) ob.setAttribute('aria-expanded','false');
    });
    if(!was){ r.classList.add('open'); b.setAttribute('aria-expanded','true'); }
  }

  /* the strip: one brief at a time, so the day never grows a second page */
  function m(btn){
    var brief=document.getElementById(btn.dataset.b); if(!brief) return false;
    var wasOpen=brief.classList.contains('on');
    document.querySelectorAll('.mt').forEach(function(b){
      b.classList.remove('on'); b.setAttribute('aria-expanded','false');
    });
    document.querySelectorAll('.mbrief').forEach(function(b){ b.classList.remove('on'); });
    if(!wasOpen){
      brief.classList.add('on');
      btn.classList.add('on');
      btn.setAttribute('aria-expanded','true');

  /* copying, shared by Ask Claude, Draft the note, Keep, Drop and Copy for Claude.
     execCommand stays as the fallback because it is the one that still works inside a
     sandboxed iframe without allow-same-origin, which is exactly the published-artefact
     case. A silent execCommand failure is a failure: `fail` runs, `done` does not. */
  function copyText(q,done,fail){
    var fb=function(){
      var ta=document.createElement('textarea'), ok=false;
      ta.value=q; ta.style.cssText='position:fixed;top:0;left:0;opacity:0';
      document.body.appendChild(ta); ta.select();
      try{ ok=document.execCommand('copy'); }catch(x){ ok=false; }
      document.body.removeChild(ta);
      if(ok) done(); else fail();
    };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(q).then(done,fb);
    } else { fb(); }
  }

  /* Ask Claude copies a standalone briefing. A second click while it still says
     Copied does nothing, so the label can never be captured as the confirmation. The
     real label is captured and restored. A blocked copy says so, and the page goes on. */
  function ask(e,a){
    e.preventDefault();
    if(a.classList.contains('ok')) return false;
    var label=a.textContent, say=function(s){
      a.textContent=s; a.classList.add('ok');
      setTimeout(function(){ a.textContent=label; a.classList.remove('ok'); },2600);
    };
    copyText(decodeURIComponent(a.dataset.q||''),
      function(){ say(L('copied')); },
      function(){ say(L('blocked')); });
    return false;
  }

  /* a cross-reference lands on its target already open, so you never arrive at a
     closed line and have to guess which one was meant. A block on the strip opens its
     brief; a flat row has nothing to open. */
  function jump(e,id){
    if(e && e.preventDefault) e.preventDefault();
    var el_=document.getElementById(id); if(!el_) return;
    if(el_.classList.contains('mt')){
      if(!el_.classList.contains('on')) m(el_);
    } else {
      var b=el_.querySelector('button');
      if(b && !el_.classList.contains('flat') && !el_.classList.contains('open')) t(b);
    }
    el_.scrollIntoView({behavior:'smooth',block:'center'});
  }
  /* a row closed from code: the toggle's state follows */
  function closeRow(r){
    r.classList.remove('open');
    var b=r.querySelector('button'); if(b) b.setAttribute('aria-expanded','false');
  }

  /* ---------- drop, with a reason ----------
     The one gesture the exec has on a line they did not write: Drop, then why. The
     word at the end of the sources row becomes the reasons, inline. A choice writes
     dismissals/<slug of ref> when this view can run the store, and otherwise copies
     a one-line briefing and marks the row "waiting for Claude". The row stays where
     it was, greyed: never moved, never hidden. */
  /* the document id: lowercase, anything not a letter or a digit as "-", 80 at most */
  function slug(s){
    return String(s==null?'':s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,80);
  }
  /* a reason as the word the exec chose, for a marker or a briefing: "done" */
  var REASON_KEY={done:'drop_done', not_important:'drop_unimportant',
                  not_a_priority:'drop_not_priority', not_a_decision:'drop_not_decision'};
  function reasonWord(reason){
    var w=L(REASON_KEY[reason]||reason); return w.charAt(0).toLowerCase()+w.slice(1);
  }
  /* the reasons in place of the gesture that asked. `anchor` and `hideAlso` hide
     while the question is up; Cancel brings them back. `pick(reason, q, restore)`
     runs on a choice with the question still up, so a failure can be said beside
     it, and `restore` is the way out. Returns the question element. */
  function askReason(anchor,choices,pick,hideAlso){
    var next=anchor.nextSibling;
    if(next && next.classList && next.classList.contains('dropq')) return next;
    var q=el('span','dropq'), hid=[anchor].concat(hideAlso||[]);
    var restore=function(){
      hid.forEach(function(x){ x.style.display=''; });
      if(q.parentNode) q.parentNode.removeChild(q);
    };
    hid.forEach(function(x){ x.style.display='none'; });
    choices.forEach(function(c){
      var b=el('button',null,c[1]); b.type='button';
      b.onclick=function(){ pick(c[0],q,restore); };
      add(q,b);
    });
    var x=el('button','x',L('cancel')); x.type='button';
    x.onclick=function(){ restore(); if(anchor.focus) anchor.focus(); };
    add(q, x, el('span','note',''));
    anchor.parentNode.insertBefore(q,anchor.nextSibling);
    q.firstChild.focus();
    return q;
  }
  /* the shared gesture: Drop at the end of the row's sources line, after Ask Claude.
     spec = {page, kind, ref, say}: page is the store's word (brief, inbox, context),
     kind is queue | decision | job | topic, ref the stable key of the line. The
     dictionary lookup can be passed as the third argument; the page's own is used
     otherwise. */
  var DROP_ROWS=[];
  function dropUI(row,spec,L_){
    var T=L_||L, src=row.querySelector('.src'); if(!src) return null;
    var a=el('a','drop',T('drop_line')); a.setAttribute('href','#');
    a.onclick=function(e){
      e.preventDefault();
      askReason(a, [['done',T('drop_done')],['not_important',T('drop_unimportant')]],
        function(reason,q,restore){ dismiss(row,spec,reason,q,restore); });
      return false;
    };
    add(src,a);
    DROP_ROWS.push({row:row, spec:spec});
    return a;
  }
  /* the state a remembered drop leaves on its row: closed, greyed, the Drop word
     gone, the marker. The same whether the drop was made now or read back from the
     store. A row already gone is left as it is, so applying it twice is harmless. */
  function dropped(row,reason){
    if(row.classList.contains('gone')) return false;
    var a=row.querySelector('.src .drop'); if(a) a.parentNode.removeChild(a);
    closeRow(row);
    row.classList.add('gone');
    var dec=row.querySelector('.dec');
    if(dec) add(dec, el('span','rel nw',L(reason==='done' ? 'dropped_done_m' : 'dropped_unimportant_m')));
    return true;
  }
  /* the write, or the briefing. With the store: one document, the row closes and
     says "remembered". Without it: the briefing is copied, the row stays open on
     "Copied" so the exec knows to paste, and says "waiting for Claude". A failed
     write or a blocked copy says so and leaves the line as it was. */
  function dismiss(row,spec,reason,q,restore){
    var btns=Array.prototype.slice.call(q.querySelectorAll('button')), note=q.querySelector('.note');
    var lock=function(on){ btns.forEach(function(b){ b.disabled=on; }); };
    var setNote=function(s,bad){ note.textContent=s; note.className='note'+(bad?' bad':''); };
    var mark=function(text){
      row.classList.add('gone');
      var dec=row.querySelector('.dec'); if(dec) add(dec, el('span','rel nw',text));
    };
    lock(true); setNote('');
    if(DB){
      var id=slug(spec.ref)||slug(row.id)||'line';
      var body={page:spec.page, kind:spec.kind, ref:String(spec.ref==null?'':spec.ref),
                say:spec.say||'', reason:reason, date:DATA.today||isoToday()};
      DB.doc('dismissals/'+id).set(body).then(function(){
        restore(); dropped(row,reason);
      }, function(err){
        lock(false); setNote(L('not_saved')+(err && err.message ? ' · '+err.message : ''), true);
      });
    } else {
      /* the sentence loses its full stop inside the quotes, so the line has one stop */
      var text=F(L('drop_briefing'),{page:L(PAGE_KEY||('page_'+spec.page)), say:String(spec.say||'').replace(/[.\s]+$/,''), reason:reasonWord(reason)});
      copyText(text, function(){
        setNote(L('copied'));
        mark(L('dropped_m')+', '+reasonWord(reason)+', '+L('waiting'));
      }, function(){ lock(false); setNote(L('blocked'),true); });
    }
  }

  /* ---------- what the exec did since publish ----------
     A drop writes the store, and nothing republishes the page until the next
     routine run. So once the store resolves, the page reads `dismissals` and applies
     each document to the row it names, page and ref both matching the spec dropUI
     registered: the same state a fresh drop leaves, without the write. The rows are
     listened to, so a drop made in another open tab lands here too; where the store
     cannot subscribe, one read. A document this tab is still writing is skipped, so
     the write's own confirmation is the only hand on that row. A read that fails, or
     a store that is null, changes nothing: the page stays as rendered from its JSON
     and no error is shown, since only writes have feedback. `then` runs after every
     delivery so the page can recount what it shows. */
  var DROP_SUB=null;
  function hydrateDrops(then){
    if(!DB || DROP_SUB || !DROP_ROWS.length) return;
    var apply=function(snap){
      (snap && snap.docs || []).forEach(function(ds){
        if(!ds.exists || (ds.metadata && ds.metadata.hasPendingWrites)) return;
        var d=ds.data()||{}, ref=String(d.ref==null?'':d.ref);
        if(!ref) return;
        DROP_ROWS.forEach(function(x){
          if(x.spec.page!==d.page || String(x.spec.ref==null?'':x.spec.ref)!==ref) return;
          dropped(x.row, d.reason==='done' ? 'done' : 'not_important');
        });
      });
      if(then) then();
    };
    var safe=function(snap){ try{ apply(snap); }catch(e){} };
    var col;
    try{ col=DB.collection('dismissals'); }catch(e){ return; }
    var once=function(){ try{ col.get().then(safe, function(){}); }catch(e){} };
    if(typeof col.onSnapshot!=='function'){ once(); return; }
    var got=false;
    try{
      DROP_SUB=col.onSnapshot(function(s){ got=true; safe(s); }, function(){ if(!got) once(); });
    }catch(e){ once(); }
  }

  /* ================ THE PRIORITY INBOX ================ */
  function chip(label,tint){ return el('span','cat'+(tint?' '+tint:''),label||''); }
  function quoted(s){ return L('q_open')+s+L('q_close'); }
  /* the filter's word for a channel: mail, or chat for Slack and Teams alike */
  function fk(c){ return c==='mail' ? 'mail' : 'chat'; }
  /* the filter words a line stands for: "mail", "chat", or "mail chat" for one topic on both */
  function chans(it){
    var out=[]; (it.channels||[it.channel]).forEach(function(c){ var k=fk(c); if(out.indexOf(k)<0) out.push(k); });
    return out.join(' ');
  }
  function tierOf(it){ return it.tier==='now'?'now':it.tier==='today'?'today':'week'; }
  function matches(chs){ return FILTER==='all' || (' '+(chs||'')+' ').indexOf(' '+FILTER+' ')>=0; }

  /* a queue line: the channel marks, the ask, when it arrived. The reveal: what to
     do, why in one line, then the sources, Ask Claude and Drop. */
  function queueRow(it){
    var r=el('div','row'); r.id=it.id; r.dataset.ch=chans(it); r.dataset.tier=tierOf(it);
    var b=el('button'); b.type='button'; b.setAttribute('aria-expanded','false');
    b.onclick=function(){ t(b); };
    var marks=el('span','chs');
    /* each mark carries its own channel, so a filtered view shows only its own */
    (it.channels||[it.channel]).forEach(function(c){ var g=channel(c); g.setAttribute('data-ch',fk(c)); add(marks,g); });
    var dec=el('span','dec'); add(dec, el('span','say',it.say||''));
    add(b, marks, dec, el('span','meta', it.meta && it.meta.value!=null ? String(it.meta.value) : ''));
    add(r,b);
    var w=el('div','why');
    if(it.lede) add(w, el('p','lede',it.lede));
    var why=(it.argument||[])[0]; if(why) add(w, el('p',null,why));
    add(w, srcRow(it.sources,it.briefing));
    add(r,w);
    var first=(it.sources||[])[0];
    /* no Drop on the inbox since 0.13.0: a line leaves when it is read; the live layer offers Lower priority */
    return r;
  }

  /* one line of a label's contents or of the rest: the channel mark, who, what, and
     when it arrived; every line is a link to its own thread */
  function miniLine(x){
    var a=link(x.href,''); a.textContent='';
    add(a, channel(x.channel), el('b',null,x.from||''), x.what||'');
    if(x.when) add(a, el('span','when',String(x.when)));
    if(a.getAttribute('href')!=='#'){ a.setAttribute('target','_blank'); a.setAttribute('rel','noopener'); }
    return a;
  }

  /* ---- the filter: All, Mail, Slack. The viewer's choice, kept on this device when
     the page may keep it; a page that may not starts on All. ---- */
  var FILTER='all', FKEY='aureol-inbox-filter', PAGE=null, SEG=null;
  function readFilter(){ try{ var v=window.localStorage.getItem(FKEY); return v==='mail'||v==='chat' ? v : 'all'; }catch(e){ return 'all'; } }
  function keepFilter(v){ try{ window.localStorage.setItem(FKEY,v); }catch(e){} }
  function chatName(d){
    var seen={};
    (d.queue||[]).forEach(function(it){ (it.channels||[it.channel]).forEach(function(c){ if(c!=='mail') seen[c]=1; }); });
    (d.filed||[]).concat(d.grouped||[]).forEach(function(f){ var bc=f.by_channel||{}; for(var c in bc){ if(c!=='mail' && bc[c]) seen[c]=1; } });
    ((d.others||{}).items||[]).forEach(function(x){ if(x.channel!=='mail') seen[x.channel]=1; });
    var ks=Object.keys(seen);
    if(ks.length===1 && ks[0]==='slack') return 'Slack';
    if(ks.length===1 && ks[0]==='teams') return 'Teams';
    return L('f_chat');
  }
  function segBar(name){
    var bar=el('div','seg'); bar.setAttribute('role','group');
    [['all',L('f_all')],['mail',L('f_mail')],['chat',name]].forEach(function(x){
      var bt=el('button'); bt.type='button'; bt.dataset.f=x[0]; bt.setAttribute('aria-pressed','false');
      add(bt, x[1], el('b',null,''));
      bt.onclick=function(){ setFilter(x[0],true); };
      add(bar,bt);
    });
    return bar;
  }
  function setFilter(f,keep){
    FILTER=f; if(keep) keepFilter(f);
    PAGE.dataset.f=f;
    if(SEG) Array.prototype.forEach.call(SEG.querySelectorAll('button'),function(bt){
      var on=bt.dataset.f===f; bt.classList.toggle('on',on); bt.setAttribute('aria-pressed',on?'true':'false');
    });
    document.querySelectorAll('.row.open').forEach(closeRow);
    syncTiers(); syncFiled(); retuck();
  }
  /* a tier with nothing left under the filter says nothing */
  function syncTiers(){
    if(!QL) return;
    var firstSeen=false;
    Array.prototype.forEach.call(QL.querySelectorAll('.tierh'),function(th){
      var any=Array.prototype.some.call(QL.querySelectorAll('.row[data-tier="'+th.dataset.tier+'"]'),function(r){ return matches(r.dataset.ch); });
      th.classList.toggle('off',!any);
      th.classList.toggle('first', any && !firstSeen);
      if(any) firstSeen=true;
    });
  }

  /* ---- what was filed: one short row per label, its tally and its name. The row
     opens on the rule and on what is inside; the tally and the lines follow the
     filter. ---- */
  var FROWS=[], FILED_H=null, FSEC=null, WITH_RULE=true;
  function labelCount(f){
    if(FILTER==='all') return f.count|0;
    var bc=f.by_channel||{}, n=0;
    for(var c in bc){ if(fk(c)===FILTER) n+=(bc[c]|0); }
    return n;
  }
  function filedRow(f){
    var r=el('div','row'); r.id=f.id;
    var b=el('button'); b.type='button'; b.setAttribute('aria-expanded','false');
    b.onclick=function(){ t(b); };
    var n=el('span','n','');
    var dec=el('span','dec'); add(dec, el('span','say', null)); dec.firstChild.appendChild(chip(f.label,f.tint));
    add(b, n, dec, el('span','meta',''));
    var w=el('div','why');
    add(r, b, w);
    FROWS.push({f:f, r:r, n:n, w:w});
    return r;
  }
  function fillFiled(x){
    var f=x.f, w=x.w; w.textContent='';
    if(f.lede) add(w, el('p','lede',f.lede));
    if(WITH_RULE && f.tint==='arch' && f.rules && f.rules.length){
      add(w, typeTag('rule'));
      var tight=el('div','tight');
      f.rules.forEach(function(x){ var p=el('p'); add(p, el('b',null,String(x.count)), quoted(x.rule||'')); add(tight,p); });

      var mini=el('div','mini');
      items.forEach(function(y){ add(mini, miniLine(y)); });
      var more=labelCount(f)-items.length;
      if(more>0){
        var ma=link(f.href, F(L(WITH_RULE?'more_label':'more_group'),{n:more}), 'more');
        if(ma.getAttribute('href')!=='#'){ ma.setAttribute('target','_blank'); ma.setAttribute('rel','noopener'); }

  function syncFiled(){
    if(!FSEC) return;

      var n=labelCount(x.f); x.n.textContent=String(n);

  /* ---- the rest, every line of it: three show, "show all N" opens the rest of the

  var OM=null, REST=null;

    var vis=[];
    Array.prototype.forEach.call(OM.children,function(a){ a.classList.remove('tk'); if(matches(a.dataset.ch)) vis.push(a); });

  function countWord(k,n){ return n==null ? L(k+'_not_read') : P('unread_'+k+'_n',n); }

    H1.textContent=headline(rows.length,k);

      var c={all:rows.length, mail:0, chat:0};
      rows.forEach(function(r){ var s=' '+r.dataset.ch+' '; if(s.indexOf(' mail ')>=0) c.mail++; if(s.indexOf(' chat ')>=0) c.chat++; });
      Array.prototype.forEach.call(SEG.querySelectorAll('button'),function(bt){ bt.querySelector('b').textContent=String(c[bt.dataset.f]); });
    }
  }

  function render(){
    var d=loadData(), page=$('page'); PAGE=page;
    var q=d.queue||[], filed=d.filed||[], grouped=d.grouped||[], counts=d.counts||{};
    var mail=counts.mail==null?null:(counts.mail|0), chat=counts.chat==null?null:(counts.chat|0);
    MAIL=mail; CHAT=chat;

    H1=page.querySelector('h1');

    (d.notices||[]).slice(0,2).forEach(function(s){ if(s) add(page, el('p','sub',String(s))); });

    /* the filter, only when there is something on both sides */
    var hasMail=(mail|0)>0 || q.some(function(it){ return chans(it).indexOf('mail')>=0; });

    var items=(d.others||{}).items||[];

      REST=el('p','rest'); OM=el('div','mini others');
      items.forEach(function(x){ var a=miniLine(x); a.dataset.ch=fk(x.channel); add(OM,a); });
      add(page, REST, OM);

    /* said only where the mailbox cannot take labels and there was something to file */
    if(!d.wrote && grouped.length) foot.push(L('nothing_written'));
    add(page, footer(foot), credit());

    setFilter(SEG ? readFilter() : 'all', false);
    recount();
    dbInit(function(){ hydrateDrops(recount); });
  }
  render();
</script>
<script>
  /* ================ THE LIVE LAYER ================

     only what arrived since, files new mail under the exec's rules, and adds three
     gestures to every queue line: the thread summarised, a reply drafted, the
     thread opened. It writes the page's JSON into #data and calls render() again;
     render() is the page's own and never changes.

     Its names start with lx or LX: the page's script is global and has a DB of its
     own. A redraw resets the page's globals render() expects empty (FROWS, FSEC,
     FILED_H, OM, REST, QL, SEG, DROP_ROWS) and ends the drop subscription.

     (per viewer, never shared) and drawn first, the banner animates while the live
     reads and the sort run, and the page redraws only when what it shows changed.

     Writes: labels only, from the exec's rules, where the run says the mail
     connection can write them; drafts the exec asks for; this page's store. Never a

  /* ---------- the mail connection: one adapter per connector the run named ---------- */

      },
      labelHref:function(account,name){ return 'https://mail.google.com/mail/?authuser='+encodeURIComponent(ACCT[account]||'')+'#label/'+encodeURIComponent(name); },
      /* the read state has its own tool on Aureol Connect: {account, thread_ids, read} (D22 there) */
      markRead:async function(x){ await LX.mcp.callTool(MAIL_CFG.server,'gmail_mark_read',{account:x.account,thread_ids:[x.thread]}); }
    },
    /* the Gmail connector: one account, labels written by id only */
    gmail:{
      read:['search_threads','get_thread','create_draft','update_draft','list_labels'],
      write:['label_thread','create_label'],
      search:function(q){ return ['search_threads',{query:q,pageSize:50,view:'THREAD_VIEW_MINIMAL'}]; },
      parse:function(p){
        return ((p||{}).threads||[]).map(function(t){
          var ms=(t.messages||[]).slice().sort(function(a,b){ return new Date(a.date)-new Date(b.date); }), m=ms[ms.length-1]||{}, labels={};
          ms.forEach(function(x){ (x.labelIds||[]).forEach(function(l){ labels[l]=1; }); });
