<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Priority inbox</title>
<!--
  THE PRIORITY INBOX. Template, built by tools/build-templates.py from design/. Do
  not edit the built file: edit design/pages/inbox.html, design/partial.css,
  design/partial.js or design/dictionary.json and rebuild.

  WHAT THIS IS
  Everything unread, in one queue, categorised and ranked. Two jobs, and they are
  different jobs. Categorising keeps the mailbox clean. Ranking decides what you
  touch. The page never lets the first pretend to be the second: the lead is a
  count, not a claim, and the bulk is called "labelled, still unread", which says
  exactly what happened and exactly what did not. Mail, Slack and Teams in one
  queue, never three tabs. The channel is a monochrome mark in the sentence.

  THE WRITES
  Labels only. Never a delete, never a send, never a mark as read, never a move.
  The routine does not archive: it labels To archive under rules the exec wrote,
  and the exec clears the label in their own mailbox. Every label opens on the rule
  that filed it and on what is inside. Where the mail role cannot write labels, the
  page shows "The rest, grouped" instead, without rules, and the footer says
  nothing was written.

  DROP
  Every queue row carries one gesture of the exec's own, Drop, at the end of its
  sources row after Ask Claude. It asks why, inline (Done, Not important), and
  writes dismissals/<slug of ref> {page: "inbox", kind: "queue", ref, say, reason:
  done|not_important, date} to this artifact's store; the row greys where it stands
  and says "remembered". The inbox routine reads that collection before it ranks
  and never brings a dropped thread back (a done thread also keeps its follow-ups
  out for 7 days). Nothing is written to the mailbox. Published with the db
  capability (capabilities: {db: {}}) so Drop is remembered; without it Drop copies
  a line for Claude and the row says "waiting for Claude".
  At load the page reads its store and applies what the exec did since publish, so
  a drop or a save survives a reload; the next routine run publishes a page without
  those rows. Once the store resolves, every dismissals document whose page is
  "inbox" and whose ref is a queue row's ref leaves that row as a fresh drop does:
  closed, greyed, "remembered", no Drop word. Recounted from the rows still
  standing: the h1's "N need you" and the queue tally "N of T". The unread counts
  are the connectors' and stay: a drop marks nothing read. A read that fails, or a
  store that is null, changes nothing and shows nothing.

  HOW IT RENDERS
  The routine never hand-writes rows. It builds one JSON document and puts it in the
  <script id="data" type="application/json"> element in place of the DATA_JSON placeholder, with
  every "<" in the serialised JSON escaped as \u003c. render() builds the whole DOM
  from that JSON. When the placeholder is left unreplaced, the page renders the example
  embedded in <script id="example">. Every UI string comes from the dictionary,
  English or French from data.lang. Data is never translated by the page.
  tools/check-page.py refuses a document that breaks a rule below.

  THE JSON, IN SHORT (the full fixture is skills/aureol-inbox/references/example.json)
    lang, date_label, time_label, today, sub, gesture, links   as on every page
    counts        { mail: 61, chat: 41 }      unread, read off the connectors on every
                  run: 0 when a channel was read and is empty, null when it could not
                  be read (the title then says "chat not read"), never absent
    notices       [ "one line" ]   what the run could not read, in the exec's language,
                  under the title; required when a count is null
    queue         [ row ]   ordered: tier, then oldest first inside a tier
      a row       { id, ref, tier: now|today|week, channel: mail|slack|teams, channels,
                    say, label: { name, tint }, meta: { kind: "time" | "date", value },
                    lede, type, argument: [p], plain: [p], go: [ref], sources, briefing }
      channels    optional, ["mail","slack"]: one topic on two channels is one line.
                  It lists every channel the line stands for, contains channel, at
                  most one thread per channel; the sentence carries one mark per
                  channel and the title counts the line once per channel
      ref         optional string, the stable key Drop is remembered under: the
                  thread id ("thread:...") or its link; a merged line joins its
                  thread ids with "+", mail first; absent, the page falls back
                  to the first source href, then to the row id
      type        precedent | knock_on | pattern | history      never absent
      meta        when the message arrived: a clock for today, a date before that
    filed         [ label ]  only where the mail role could write labels
      a label     { id, label, tint, count, by_channel: { mail, slack, teams },
                    say, lede, rule, plain: [p], contents: [item], href, briefing }
                  lede only when something inside deserves the exec's eye; no
                  sources, the contents are the sources;
                  tint is one of sales|product|board|customers|hiring|later|arch;
                  arch is To archive, drawn as an outline, and carries rules: [{count,
                  rule}] instead of one rule; every other label carries its rule, in
                  the exec's words
      an item     { channel, from, what, href }   3 to 5 of them, every one a link;
                  the count minus the items shown is "and N more in this label"
    grouped       [ group ]  the same shape without rule, when filed is empty
    wrote         true when labels were written, false otherwise
    next_run      "13:00"
    others        { mail: 3, chat: 2, items: [ { channel, from, what, href, when } ] }  every
                  unread that is neither waiting on the exec nor filed, the full list, newest
                  first, so the title's counts reconcile: counts.mail = queue lines carrying
                  mail + filed mail + others.mail, same for chat. The page shows 3 lines and
                  "show all N" opens the rest. Absent or zero: nothing rendered.
      ref         { id } same page (opens the target) or { page, id } another page
      src         { kind: mail|chat|calendar|doc|meeting|file|you, via, label, href }

  THE RIGHT COLUMN IS WHEN IT ARRIVED
  Precise due times and computed lateness were tried and cut. A receipt time is a
  fact. Brick left this page with the lateness mark: nothing an inbox page can see
  proves that time is broken. No strip either: an inbox has no axis.

  DESIGN
  See design/partial.css. No em dashes. Numerals in the title and the tallies.
  Self-contained: no webfonts, no assets, no network.

{{SECURITY}}
-->
<style>
{{CSS}}
</style>
</head>
<body>
{{GLYPHS}}
<div class="page" id="page"></div>

<script id="data" type="application/json">{{DATA_JSON}}</script>
<script id="example" type="application/json">{{EXAMPLE_JSON}}</script>
<script>
var DICT={{DICT}};
{{JS}}

  /* ================ THE PRIORITY INBOX ================ */
  function chip(label,tint){ return el('span','cat'+(tint?' '+tint:''),label||''); }
  function quoted(s){ return L('q_open')+s+L('q_close'); }

  /* a queue row: tier, channel mark, sentence, label and arrival */
  function queueRow(it){
    var r=el('div','row'); r.id=it.id;
    var b=el('button'); b.type='button'; b.setAttribute('aria-expanded','false');
    b.onclick=function(){ t(b); };
    var tier=it.tier==='now'?'now':it.tier==='today'?'today':'week';
    var say=el('span','say');
    (it.channels||[it.channel]).forEach(function(c){ add(say, channel(c)); });
    add(say, it.say||'');
    var meta=el('span','meta');
    if(it.label && it.label.name) add(meta, chip(it.label.name,it.label.tint));
    add(meta, it.meta && it.meta.value!=null ? String(it.meta.value) : '');
    var dec=el('span','dec'); add(dec,say);
    add(b, el('span','tier '+tier,L('tier_'+tier)), dec, meta);
    add(r,b);
    var w=el('div','why');
    if(it.lede) add(w, el('p','lede',it.lede));
    add(w, typeTag(it.type));
    paras(w,it.argument); paras(w,it.plain,'plain');
    goRows(w,it.go);
    add(w, srcRow(it.sources,it.briefing));
    add(r,w);
    var first=(it.sources||[])[0];
    dropUI(r, {page:'inbox', kind:'queue', ref: it.ref || (first && first.href) || it.id, say:it.say||''});
    return r;
  }

  /* one line of a label's contents or of the rest: the channel mark, who, what, and
     when it arrived; every line is a link to its own thread */
  function miniLine(x){
    var a=link(x.href,''); a.textContent='';
    add(a, channel(x.channel), el('b',null,x.from||''), x.what||'');
    if(x.when) add(a, el('span','when',String(x.when)));
    if(a.getAttribute('href')!=='#'){ a.setAttribute('target','_blank'); a.setAttribute('rel','noopener'); }
    return a;
  }

  /* a filed label: the tally, the chip, the sentence, the count per channel, and a
     reveal that opens on the rule and on what is inside */
  function filedRow(f,withRule){
    var r=el('div','row'); r.id=f.id;
    var b=el('button'); b.type='button'; b.setAttribute('aria-expanded','false');
    b.onclick=function(){ t(b); };
    var say=el('span','say'); add(say, chip(f.label,f.tint), f.say||'');
    var meta=el('span','meta'), bc=f.by_channel||{};
    ['mail','slack','teams'].forEach(function(c){
      if(bc[c]) add(meta, channel(c,'ch sm'), String(bc[c]));
    });
    var dec=el('span','dec'); add(dec,say);
    add(b, el('span','n',String(f.count==null?'':f.count)), dec, meta);
    add(r,b);
    var w=el('div','why');
    if(f.lede) add(w, el('p','lede',f.lede));
    if(withRule && f.tint==='arch' && f.rules && f.rules.length){
      add(w, typeTag('rule'));
      var tight=el('div','tight');
      f.rules.forEach(function(x){ var p=el('p'); add(p, el('b',null,String(x.count)), quoted(x.rule||'')); add(tight,p); });
      add(w,tight);
    } else if(withRule && f.rule){
      add(w, typeTag('rule'), el('p',null,quoted(f.rule)));
    }
    paras(w,f.plain,'plain');
    var items=(f.contents||[]).slice(0,5);
    if(items.length){
      var mini=el('div','mini');
      items.forEach(function(x){ add(mini, miniLine(x)); });
      var more=(f.count|0)-items.length;
      if(more>0){
        var ma=link(f.href, F(L(withRule?'more_label':'more_group'),{n:more}), 'more');
        if(ma.getAttribute('href')!=='#'){ ma.setAttribute('target','_blank'); ma.setAttribute('rel','noopener'); }
        add(mini,ma);
      }
      add(w,mini);
    }
    add(w, srcRow(f.sources,f.briefing));
    add(r,w);
    return r;
  }

  /* the counts that depend on the queue rows: the h1's "N need you" and the tally.
     Recounted from the rows still standing once the store has said what was dropped. */
  var H1=null, QT=null, QL=null, MAIL=0, CHAT=0;
  /* a count in the title: a numeral when the channel was read, "not read" when it
     could not be, so a zero can only mean read and empty */
  function countWord(k,n){ return n==null ? L(k+'_not_read') : P('unread_'+k+'_n',n); }
  function recount(){
    var n=QL.querySelectorAll('.row:not(.gone)').length;
    H1.textContent=countWord('mail',MAIL)+', '+countWord('chat',CHAT)+'. '+P('need_you_n',n);
    QT.textContent=F(L('of'),{n:n,t:(MAIL|0)+(CHAT|0)});
  }

  function render(){
    var d=loadData(), page=$('page');
    var q=d.queue||[], filed=d.filed||[], grouped=d.grouped||[], counts=d.counts||{};
    var mail=counts.mail==null?null:(counts.mail|0), chat=counts.chat==null?null:(counts.chat|0);
    MAIL=mail; CHAT=chat;

    header(page,'page_inbox', countWord('mail',mail)+', '+countWord('chat',chat)+'. '+P('need_you_n',q.length));
    H1=page.querySelector('h1');
    (d.notices||[]).forEach(function(s){ if(s) add(page, el('p','sub',String(s))); });

    /* ---- the queue ---- */
    var hq=h2(L('needs_you'),F(L('of'),{n:q.length,t:(mail|0)+(chat|0)})); QT=hq.querySelector('b');
    add(page, hq);
    var ql=el('div','list queue'); q.forEach(function(it){ add(ql,queueRow(it)); }); add(page,ql); QL=ql;

    /* ---- the filing, or the grouping ---- */
    var bulk = filed.length ? filed : grouped, withRule = filed.length>0;
    if(bulk.length){
      var sum=0; bulk.forEach(function(f){ sum+=(f.count|0); });
      add(page, h2(L(withRule?'labelled':'grouped'),String(sum)));
      var fl=el('div','list filed'); bulk.forEach(function(f){ add(fl,filedRow(f,withRule)); }); add(page,fl);
    }

    /* ---- the rest, every line of it, so every unread is somewhere on the page:
       three lines show, "show all N" opens the rest. Plain lines, no reveal, no Drop. ---- */
    var oth=d.others||{}, othN=(oth.mail|0)+(oth.chat|0);
    if(othN>0){
      add(page, el('p','rest', P('others_line',othN)));
      var om=el('div','mini others');
      (oth.items||[]).forEach(function(x){ add(om, miniLine(x)); });
      tuck(om, 3, 'show_all_n');
      add(page, om);
    }

    var right = d.wrote ? '' : L('nothing_written');
    add(page, footer([d.next_run ? F(L('next_run'),{t:d.next_run}) : '', right]), credit());
    dbInit(function(){ hydrateDrops(recount); });
  }
  render();
</script>
</body>
</html>
